name: Deploy to EC2 (Nest)

on:
  push:
    branches:
      - feature/nestjs-migration

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build project
        run: npm run build

      # Upload only dist + package.json
      - name: Upload build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: |
            dist/*
            package.json
            package-lock.json
          target: "/home/ubuntu/server/careConnect-server"

      - name: Restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/ubuntu/server/careConnect-server

            echo "Installing production deps only..."
            npm ci --omit=dev

            echo "Restarting PM2..."
            pm2 restart careconnect || pm2 start dist/main.js --name careconnect

            pm2 save
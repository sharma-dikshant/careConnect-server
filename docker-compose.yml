version: "3.8"

services:
  # ---------- Backend DB ----------
  postgres:
    image: postgres:15
    container_name: backend-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-dikshant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-care_connect}
    ports:
      - "5434:5432"
    volumes:
      - backend_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dikshant} -d ${DB_NAME:-care_connect}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  # ---------- AI DB ----------
  rag-db:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "5436:5432"
    volumes:
      - rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-user}", "-d", "${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  # ---------- AI Server ----------
  ai-server:
    image: dikshant04/careconnect-ai:latest
    container_name: dev-ai
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      DATABASE_HOST: rag-db
      DATABASE_PORT: 5432
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - rag-db
    networks:
      - dev-network

  # ---------- Backend (DEV MODE) ----------
  backend:
    build:
      context: .
    container_name: backend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:cached
      - /app/node_modules
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-dikshant}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-care_connect}
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
      ai-server:
        condition: service_started
    networks:
      - dev-network

# ------- Frontend ------------
  frontend:
    image: dikshant04/careconnect-frontend:latest
    container_name: cc-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:3000}
    depends_on:
      - backend
    networks:
      - dev-network

# ---------- Volumes ----------
volumes:
  backend_pg_data:
  rag_pg_data:

# ---------- Network ----------
networks:
  dev-network:
    driver: bridge